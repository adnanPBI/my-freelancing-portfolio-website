<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio — Private Inbox</title><link rel="stylesheet" href="/styles.css"><style>body{background:#0b121c;color:#f5f1e9;min-height:100vh}.admin{max-width:1100px;margin:50px auto;padding:0 22px}.admin h1{font-size:clamp(36px,5vw,58px);letter-spacing:-.07em}.admin small{color:#9aabb7}.admin button{border:1px solid #9e825f;background:#d6b582;color:#0b1520;padding:13px 17px;font-weight:700}.admin input{background:#16232e;border:1px solid #4f606a;color:#fff;padding:13px;min-width:270px;max-width:100%}.admin .actions{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.admin table{border-collapse:collapse;width:100%;font-size:13px}.admin th,.admin td{border:1px solid #43525f;padding:10px;text-align:left;vertical-align:top;overflow-wrap:anywhere}.admin th{background:#192734}.admin td{max-width:280px}.admin .scroll{overflow-x:auto}.admin .delete{background:transparent;color:#f2bfaf;border-color:#ba8174;padding:8px}.admin a{color:#d6b582;text-decoration:underline}</style></head><body><main class="admin"><a href="/">← Back to portfolio</a><h1>Private inquiry inbox<span style="color:#d6b582">.</span></h1><small>Enter your configured ADMIN_TOKEN to review locally stored inquiries. Token is held only in this browser page's memory, never in web storage.</small><div class="actions"><input id="token" type="password" placeholder="Admin token (min 16 characters)" aria-label="Admin access token"><button id="load">Open inbox</button><button id="csv" disabled>Export CSV</button><button id="lock" disabled>Lock</button></div><p id="status" role="status" aria-live="polite"></p><div class="scroll"><table><thead><tr><th>Date</th><th>Name</th><th>Work email</th><th>Area</th><th>Message</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></main><script type="module" src="/admin.js"></script></body></html>
